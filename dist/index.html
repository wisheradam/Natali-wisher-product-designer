<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#e8edf4">
  <meta name="description" content="Natali Wisher — UX/UI & Product Designer. A new portfolio is coming soon.">
  <title>Natali Wisher — Coming Soon</title>
  <link rel="canonical" href="https://nataliwisher.com/">
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif;color:#222a38;background:#e8edf4;font-synthesis:none}
    *{box-sizing:border-box}body{margin:0;min-height:100svh;display:flex;flex-direction:column;isolation:isolate;background:radial-gradient(ellipse at 14% 70%,#89a8e0aa,transparent 49%),radial-gradient(ellipse at 85% 32%,#b8c9df,transparent 48%),radial-gradient(ellipse at 68% 93%,#ddbdd6aa,transparent 43%),#e8edf4}
    body:before{content:"";position:fixed;inset:0;z-index:-1;background:linear-gradient(125deg,transparent 35%,#ffffff8c 49%,transparent 62%);pointer-events:none}
    header,footer{display:flex;justify-content:space-between;align-items:center;padding:clamp(24px,4vw,56px) clamp(24px,6vw,88px);gap:20px}header{font-size:18px;letter-spacing:-.035em;font-weight:600}header span:last-child{font-size:14px;letter-spacing:0;font-weight:400;color:#515c6c}
    main{flex:1;display:grid;place-items:center;padding:48px 24px 64px}
    .glass{position:relative;text-align:center;width:min(850px,100%);padding:clamp(64px,9vw,112px) 24px;border:1px solid #ffffffd9;border-radius:44px;background:linear-gradient(135deg,#ffffff6b,#ffffff24 45%,#ffffff55);box-shadow:inset 1px 1px 1px #fff,inset -1px -1px 1px #ffffff80,0 32px 80px -36px #4c628369,0 5px 16px #ffffff33;backdrop-filter:blur(30px) saturate(130%);-webkit-backdrop-filter:blur(30px) saturate(130%);animation:arrive 1.2s ease-out both}
    .eyebrow{display:inline-block;margin:0 0 28px;padding:10px 17px;border-radius:99px;background:#ffffff50;box-shadow:inset 0 1px 0 #ffffffb3;border:1px solid #ffffff80;font-size:14px;color:#4b5769;letter-spacing:.02em}
    h1{font-size:clamp(54px,9vw,104px);font-weight:500;line-height:1.06;letter-spacing:-.07em;margin:0 0 25px;text-wrap:balance;text-shadow:0 2px 1px #ffffff8c}
    .subtitle{margin:0;font-size:clamp(16px,2.2vw,20px);line-height:1.6;color:#536075;letter-spacing:-.02em}
    footer{font-size:13px;color:#596576;padding-top:24px}footer p{margin:0}
    @keyframes arrive{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
    @media(max-width:550px){header{align-items:flex-start;flex-direction:column;gap:8px}.glass{border-radius:32px;padding:72px 20px}main{padding:32px 20px}footer{align-items:flex-start;flex-direction:column;gap:8px}}
    @media(prefers-reduced-motion:reduce){.glass{animation:none}}
  </style>
</head>
<body>
  <header><span>Natali Wisher</span><span>UX/UI &amp; Product Designer</span></header>
  <main><section class="glass" aria-labelledby="title"><p class="eyebrow">Portfolio in progress</p><h1 id="title">Coming Soon</h1><p class="subtitle">Thoughtful experiences. Coming into view.</p></section></main>
  <footer><p>© 2026 Natali Wisher</p><p>nataliwisher.com</p></footer>
</body>
</html>
